name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group
        run: az group create --name rg-st10538419-cldv7112 --location uaenorth
      - uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: rg-st10538419-cldv7112
          deploymentName: main
          template: infra/main.bicep
          parameters: infra/main.parameters.json
          additionalArguments: --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish web
        run: dotnet publish src/ST10538419_CLDV7112_Practicium.Web/ST10538419_CLDV7112_Practicium.Web.csproj --configuration Release --output ./publish
      - name: Publish functions
        run: dotnet publish src/ST10538419_CLDV7112_Practicium.Functions/ST10538419_CLDV7112_Practicium.Functions.csproj --configuration Release --output ./publish-functions
      - name: Deploy zip
        run: |
          WEB_NAME="$(az deployment group show --resource-group rg-st10538419-cldv7112 --name main --query properties.outputs.webAppName.value -o tsv)"
          FUNCTION_NAME="$(az deployment group show --resource-group rg-st10538419-cldv7112 --name main --query properties.outputs.functionAppName.value -o tsv)"
          (cd publish && zip -qr ../web.zip .)
          (cd publish-functions && zip -qr ../fn.zip .)
          az webapp deploy --resource-group rg-st10538419-cldv7112 --name "$WEB_NAME" --src-path "$PWD/web.zip" --type zip
          az functionapp deploy --resource-group rg-st10538419-cldv7112 --name "$FUNCTION_NAME" --src-path "$PWD/fn.zip" --type zip
